<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1c3f"/>
      <stop offset="50%" stop-color="#182c5b"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
  </defs>

  <!-- Arka Plan -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Örgüsel Ağ Izgarası ve Düğümler (Mesh Network Nodes) -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="2">
    <line x1="150" y1="120" x2="350" y2="220"/>
    <line x1="350" y1="220" x2="250" y2="450"/>
    <line x1="250" y1="450" x2="550" y2="400"/>
    <line x1="350" y1="220" x2="600" y2="180"/>
    <line x1="600" y1="180" x2="850" y2="280"/>
    <line x1="550" y1="400" x2="850" y2="280"/>
    <line x1="850" y1="280" x2="1050" y2="160"/>
    <line x1="850" y1="280" x2="1020" y2="460"/>
    <line x1="550" y1="400" x2="750" y2="520"/>
  </g>

  <!-- Düğüm Noktaları -->
  <circle cx="150" cy="120" r="10" fill="#4facfe" filter="drop-shadow(0 0 8px #4facfe)"/>
  <circle cx="350" cy="220" r="14" fill="#00f2fe" filter="drop-shadow(0 0 10px #00f2fe)"/>
  <circle cx="250" cy="450" r="10" fill="#4facfe"/>
  <circle cx="600" cy="180" r="12" fill="#00f2fe"/>
  <circle cx="550" cy="400" r="16" fill="#67c23a" filter="drop-shadow(0 0 12px #67c23a)"/>
  <circle cx="850" cy="280" r="15" fill="#4facfe" filter="drop-shadow(0 0 10px #4facfe)"/>
  <circle cx="1050" cy="160" r="9" fill="#00f2fe"/>
  <circle cx="1020" cy="460" r="11" fill="#4facfe"/>
  <circle cx="750" cy="520" r="10" fill="#67c23a"/>

  <!-- Logo İkonu -->
  <g transform="translate(100, 190)">
    <circle cx="60" cy="60" r="56" fill="#2a4b8d" stroke="#4facfe" stroke-width="4"/>
    <path d="M35 60 L60 35 L85 60 L60 85 Z" fill="none" stroke="white" stroke-width="6"/>
    <circle cx="60" cy="35" r="9" fill="#67c23a"/>
    <circle cx="35" cy="60" r="9" fill="#67c23a"/>
    <circle cx="85" cy="60" r="9" fill="#67c23a"/>
    <circle cx="60" cy="85" r="9" fill="#67c23a"/>
  </g>

  <!-- Başlık ve Metinler -->
  <text x="250" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="bold" fill="#ffffff" letter-spacing="-1">
    Meshtastic Vikipedi
  </text>
  <text x="250" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" fill="url(#accent)" font-weight="600">
    Özgür LoRa Yazılım ve Donanım Terimleri Sözlüğü
  </text>
  <text x="250" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#cbd5e1">
    Türkçe - İngilizce Ansiklopedik Başvuru Kaynağı &amp; Rehber
  </text>

  <!-- Etiket Rozetleri -->
  <g transform="translate(250, 380)">
    <!-- Rozet 1 -->
    <rect x="0" y="0" width="130" height="42" rx="21" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="65" y="27" font-family="sans-serif" font-size="16" fill="#93c5fd" font-weight="bold" text-anchor="middle">📡 LoRa CSS</text>

    <!-- Rozet 2 -->
    <rect x="145" y="0" width="145" height="42" rx="21" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="217" y="27" font-family="sans-serif" font-size="16" fill="#93c5fd" font-weight="bold" text-anchor="middle">⚡ SX1262 / nRF</text>

    <!-- Rozet 3 -->
    <rect x="305" y="0" width="160" height="42" rx="21" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="385" y="27" font-family="sans-serif" font-size="16" fill="#93c5fd" font-weight="bold" text-anchor="middle">🔒 AES-256 / PKC</text>

    <!-- Rozet 4 -->
    <rect x="480" y="0" width="150" height="42" rx="21" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="555" y="27" font-family="sans-serif" font-size="16" fill="#93c5fd" font-weight="bold" text-anchor="middle">📦 Protobufs</text>
  </g>

  <!-- Altbilgi -->
  <text x="100" y="560" font-family="monospace" font-size="20" fill="#64748b">
    https://mserman90.github.io/meshtastic-sozluk/
  </text>
  <text x="1100" y="560" font-family="sans-serif" font-size="18" fill="#64748b" text-anchor="end">
    Wikipedia Formatında Açık Kaynak
  </text>
</svg>
